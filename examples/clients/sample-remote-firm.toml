[export]
# Options for scripts/export.py. All optional; these are the defaults except prepared_by.
font = "Arial"
primary_color = "1F4E79"           # header rows and headings, as a hex color
prepared_by = "Example Security Partners"
logo = ""                          # path to a PNG or JPG for the page header; empty for none
include_not_adopted = false
