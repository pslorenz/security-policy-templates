# Sample client config: a remote-first professional services firm of about twenty people,
# running entirely on SaaS with an outside IT provider. Generate it with:
#
#     python3 scripts/generate.py examples/clients/sample-remote-firm.toml
#
# Every key under [values] must be a registered placeholder in placeholders.toml with
# phase = "adoption". Use-time placeholders (template fill-in fields) are never set here.

[generation]
# When true, any adoption-time placeholder without a value is filled with the library's
# example text and listed in GENERATION_REPORT.md for review. Leave false for real clients
# until every value has been decided.
use_examples = false
# The closing attribution line is removed from every document by default, and a NOTICE
# file credits the source once. Set true to keep the line, for example when building a
# collection to redistribute.
keep_attribution = false

[scope]
# The five questions from docs/adoption-guide.md.
office_network = false
self_hosted_internet_services = false
writes_code = "scripts"            # none | scripts | internal | internet-facing
regulated_data = []                # any of: cui, health, payment-card, nydfs
it_provider = true

[documents]
# Status for any document that is not simply "Adopted". Addenda default to "Not adopted",
# and POL-DEV-001 defaults from scope.writes_code.
"STD-DC-001" = "Planned"
"TPL-LOG-002" = "Not adopted"

[values]
ORGANIZATION_NAME = "Harbor & Pine Advisory LLC"
EFFECTIVE_DATE = 2027-01-15
POLICY_OWNER = "Dana Whitfield, Operations Director"
EXECUTIVE_SPONSOR = "Marcus Oyelaran, Managing Partner"

# Governance
INFORMATION_SECURITY_FUNCTION = "the Operations Director, supported by the designated security service provider"
ORGANIZATION_GOVERNANCE_BODY = "the partners"
APPLICABLE_OBLIGATIONS = ["state breach notification laws", "client confidentiality terms", "cyber insurance policy requirements"]
RISK_APPETITE_STATEMENT = """
Harbor & Pine accepts moderate risk to the speed of internal operations, and low risk to
the confidentiality of client information. Residual risks rated Critical are not accepted.
"""
AUP_VERSION = "1.0"
GOV_VERSION = "1.0"
ANNUAL_ACKNOWLEDGMENT_MONTH = "January"
TESTING_TIER = "Baseline"

# People and processes
REPORTING_CHANNEL = "security@harborpine.example or the IT provider's help desk"
REPORT_PHISHING_PROCESS = "the report button in the mail client"
