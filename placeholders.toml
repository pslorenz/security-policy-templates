# Placeholder registry
#
# Every placeholder used in the library's documents is listed here. This file is the
# source of truth: scripts/check_library.py fails if a document uses a placeholder that
# is not registered, or if a registered placeholder is no longer used, and
# scripts/generate.py uses the phase to decide what to substitute.
#
# phase = "adoption"  filled once, when the library is customized for an organization
# phase = "use"       filled each time a template or message is used; generate.py never
#                     substitutes these
#
# section and question (adoption-time placeholders) place the placeholder in the intake
# questionnaire, docs/intake-questionnaire.md. default (optional) supplies a value when the
# client config gives none; placeholders with a default are not asked in the questionnaire.
#
# group (optional) collects related placeholders into one row of the customization guide's
# placeholder table. The table is generated from this file: python3 scripts/generate.py --update-guide,
# which also regenerates the intake questionnaire

